{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZONIX | Visión Inteligente, Decisiones Más Grandes</title>
  <link rel="icon" type="image/png" href="{% static 'ZONIX LOGO.png' %}" />
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(92, 255, 0, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(0, 184, 255, 0.14) 0%, transparent 48%),
        #030508;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #070b12 0%, #04070c 100%);
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 32px 30px;
      position: relative;
      box-shadow:
        0 0 35px rgba(92, 255, 0, 0.12),
        0 0 45px rgba(0, 184, 255, 0.14);
      background-clip: padding-box;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: -1.5px;
      border-radius: 21px;
      padding: 1.5px;
      background: linear-gradient(135deg, #5cff00 0%, #00e5ff 55%, #0077ff 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }
    .logo-img {
      width: 175px;
      height: 175px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 0 18px rgba(92, 255, 0, 0.25)) drop-shadow(0 0 22px rgba(0, 184, 255, 0.28));
      margin-bottom: 10px;
    }
    .tagline {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.4px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background: #020408;
      color: #f8fafc;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.16);
    }
    /* Evitar fondo blanco de autocompletado del navegador */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #f8fafc;
      -webkit-box-shadow: 0 0 0 1000px #020408 inset;
      transition: background-color 5000s ease-in-out 0s;
    }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #5cff00 0%, #00d4ff 100%);
      color: #02060c;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.22);
      transition: transform 0.15s, filter 0.15s;
    }
    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    .msg {
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      background: rgba(0, 184, 255, 0.12);
      border: 1px solid rgba(0, 184, 255, 0.45);
      color: #bae6fd;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="{% static 'ZONIX LOGO.png' %}" alt="ZONIX Logo" class="logo-img" />
      <p class="tagline">RetailVision Analytics · Analítica Comercial Anónima</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <label for="username">Usuario</label>
      <input id="username" type="text" name="username" placeholder="Ingresa tu usuario" required autofocus />

      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" placeholder="••••••••••••" required />

      <button type="submit">Iniciar Sesión</button>
    </form>
  </div>
</body>
</html>
